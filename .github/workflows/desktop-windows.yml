name: MR.K Typeless 데스크톱 (Windows exe)

on:
  push:
    branches: [claude/busy-clarke-gpn9p0, main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows 콘솔 기본 인코딩(cp1252)에서 한글 출력이 깨지지 않도록
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: 테스트
        run: python -m pytest -q tests

      - name: 아이콘 만들기
        run: python make_icon.py build/icon.ico

      - name: exe 만들기
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MRK-Typeless --icon build/icon.ico
          --hidden-import pystray._win32
          run.py

      - name: exe 자체 점검
        run: |
          $p = Start-Process -FilePath dist/MRK-Typeless.exe -ArgumentList '--self-test','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MRK-Typeless
          path: desktop/dist/MRK-Typeless.exe

      - name: 버전 읽기
        id: ver
        run: echo "version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: MR.K Typeless 데스크톱 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: desktop/RELEASE_NOTES.md
          files: desktop/dist/MRK-Typeless.exe
          make_latest: true
