name: MR.K Typeless 데스크톱 (Windows 설치 프로그램)

on:
  push:
    branches: [claude/busy-clarke-gpn9p0, main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows 콘솔 기본 인코딩(cp1252)에서 한글 출력이 깨지지 않도록
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: 테스트
        run: python -m pytest -q tests

      - name: 아이콘 만들기
        run: python make_icon.py build/icon.ico

      - name: exe 만들기 (설치 없이 바로 실행하는 한 파일)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name MRK-Typeless --icon build/icon.ico
          --hidden-import pystray._win32
          run.py

      - name: 설치용 폴더 만들기 (빨리 켜지도록 풀어 둔 형태)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name MRK-Typeless --icon build/icon.ico
          --hidden-import pystray._win32
          --distpath dist-dir --workpath build/work-dir
          run.py

      - name: exe 자체 점검
        run: |
          foreach ($exe in @('dist/MRK-Typeless.exe', 'dist-dir/MRK-Typeless/MRK-Typeless.exe')) {
            $p = Start-Process -FilePath $exe -ArgumentList '--self-test','selftest.txt' -Wait -PassThru
            Write-Host "== $exe"
            Get-Content selftest.txt
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - name: 설치 프로그램 만들기 (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$((Get-Content VERSION).Trim())" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item build/MRK-Typeless-Setup.exe | Select-Object Name, Length

      - name: 설치 → 실행 점검 → 제거 점검
        run: |
          $p = Start-Process -FilePath build/MRK-Typeless-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "설치 실패 ($($p.ExitCode))"; exit 1 }
          $dir = "$env:LOCALAPPDATA\Programs\MRK-Typeless"
          $exe = "$dir\MRK-Typeless.exe"
          if (-not (Test-Path $exe)) { Write-Error "설치된 exe가 없습니다"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test','installed.txt' -Wait -PassThru
          Get-Content installed.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Write-Host "시작 메뉴:" (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MR.K Typeless.lnk")
          Write-Host "바탕화면:" (Test-Path "$([Environment]::GetFolderPath('Desktop'))\MR.K Typeless.lnk")
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { Write-Error "제거한 뒤에도 exe가 남아 있습니다"; exit 1 }
          Write-Host "설치·제거 정상"

      - uses: actions/upload-artifact@v4
        with:
          name: MRK-Typeless
          path: |
            desktop/dist/MRK-Typeless.exe
            desktop/build/MRK-Typeless-Setup.exe

      - name: 버전 읽기
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION).Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          # 같은 버전의 릴리스가 이미 있으면 덮어쓰지 않습니다 (VERSION을 올려야 새로 올라감).
          gh release view "desktop-v$v" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) { echo "publish=false" >> $env:GITHUB_OUTPUT; Write-Host "desktop-v$v 릴리스가 이미 있어 올리지 않습니다 (artifact만 남김)" }
          else { echo "publish=true" >> $env:GITHUB_OUTPUT }

      - name: 릴리스에 올리기
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.ver.outputs.version }}
          name: MR.K Typeless 데스크톱 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: desktop/RELEASE_NOTES.md
          files: |
            desktop/build/MRK-Typeless-Setup.exe
            desktop/dist/MRK-Typeless.exe
          make_latest: true
