<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:900;src:url(Pretendard-Black.otf)}
@font-face{font-family:P;font-weight:800;src:url(Pretendard-ExtraBold.otf)}
@font-face{font-family:P;font-weight:700;src:url(Pretendard-Bold.otf)}
@font-face{font-family:P;font-weight:600;src:url(Pretendard-SemiBold.otf)}
:root{--y:#FFD60A;--c:#22D3EE;--r:#FF3B4E;--g:#34E28A;--bg:#070B16}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:P,'Noto Color Emoji',sans-serif;color:#fff}
#root{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:-10%}
#grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px}
#stage{position:absolute;left:0;top:0;width:1920px;height:980px}
.it{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.y{color:var(--y)}.r{color:var(--r)}
.card{background:#fff;color:#0b1020;font-weight:800;font-size:40px;padding:18px 32px;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.45);position:relative;text-align:center;line-height:1.25}
.card .y{color:#c48a00}.card .r{color:#e0142c}
.ybox .y{color:#c4001a}
.ybox{background:var(--y);color:#111;font-weight:900;font-size:44px;padding:16px 34px;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.rbox{background:var(--r);color:#fff;font-weight:900;font-size:40px;padding:14px 30px;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.cbox{background:var(--c);color:#04212a;font-weight:900;font-size:46px;padding:14px 36px;border-radius:999px}
.chip{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);font-weight:800;font-size:36px;padding:12px 28px;border-radius:999px;backdrop-filter:blur(4px)}
.note{background:rgba(10,16,34,.8);border-left:8px solid var(--y);font-weight:700;font-size:32px;padding:12px 24px;border-radius:8px}
.warn{background:rgba(255,59,78,.14);border:3px solid var(--r);font-weight:800;font-size:38px;padding:14px 30px;border-radius:14px}
.warn .r{color:#ff6b7a}
.stamp{font-weight:900;font-size:96px;color:var(--r);border:12px solid var(--r);padding:4px 40px;border-radius:18px;background:rgba(255,59,78,.1);transform:rotate(-8deg);display:inline-block}
.num{font-weight:900;font-size:170px;color:var(--y);text-shadow:0 0 50px rgba(255,214,10,.5);letter-spacing:-.04em}
.big{font-weight:900;font-size:120px;letter-spacing:-.03em;color:#fff;text-shadow:0 0 40px rgba(255,214,10,.35)}
.bubble{background:#fff;color:#111;font-weight:900;font-size:46px;padding:22px 40px;border-radius:40px;position:relative}
.bubble:after{content:'';position:absolute;left:60px;bottom:-26px;border-left:22px solid transparent;border-right:22px solid transparent;border-top:30px solid #fff}
.op{font-weight:900;font-size:40px;color:var(--y);padding:4px 20px;border:3px solid var(--y);border-radius:999px}
.tile{background:#15213d;border:3px solid rgba(255,255,255,.2);border-radius:22px;padding:22px 30px;font-weight:800;font-size:38px;text-align:center;line-height:1.3;min-width:220px}
.okc{border:6px solid var(--g)}.noc{opacity:.92}
.mk{position:absolute;right:-18px;top:-22px;width:56px;height:56px;border-radius:50%;font-size:38px;display:flex;align-items:center;justify-content:center;color:#fff}
.okc .mk{background:var(--g)}.noc .mk{background:var(--r)}
.node{background:#15213d;border:3px solid var(--c);color:#fff;font-weight:900;font-size:40px;padding:16px 26px;border-radius:16px}
.arrow{font-weight:900;font-size:34px;color:var(--y);padding:6px 10px}
.ex{background:#2a1520;color:#ff9aa5;border:2px solid var(--r);font-weight:800;font-size:30px;padding:8px 20px;border-radius:10px;text-decoration:line-through;text-decoration-thickness:4px}
.calc{background:#fff;color:#111;font-weight:900;font-size:40px;padding:20px 40px 26px;border-radius:22px;text-align:center}
.calc .cal{font-size:110px;line-height:1;margin-bottom:8px;color:#333}
.calc.hot{background:var(--y)}.calc .cal.y{color:#111}
.step{background:#15213d;border:4px solid var(--y);border-radius:20px;padding:22px 34px;font-weight:900;font-size:44px;text-align:center;line-height:1.25}
.step small{font-size:30px;font-weight:700;color:#cfd6e6}
.sum{background:#15213d;border-top:10px solid var(--y);border-radius:16px;padding:22px 20px;font-weight:900;font-size:36px;text-align:center;line-height:1.35;width:380px;white-space:normal}
.sum small{font-size:26px;font-weight:700;color:#cfd6e6}
.bar{display:flex;width:760px;height:78px;border-radius:14px;overflow:hidden;font-weight:900;font-size:30px}
.bar .b1{width:36%;background:#46506b;display:flex;align-items:center;justify-content:center}
.bar .b2{flex:1;background:var(--y);color:#111;display:flex;align-items:center;justify-content:center}
.fcard{font-weight:900;font-size:110px;text-align:center;line-height:1.2;letter-spacing:-.03em;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.fnum{font-weight:900;font-size:170px;color:var(--y);letter-spacing:-.03em;text-shadow:0 0 60px rgba(255,214,10,.55)}
.chap{display:flex;align-items:center;gap:22px;font-weight:900;font-size:46px;background:rgba(7,11,22,.85);border:2px solid rgba(255,214,10,.6);padding:10px 30px 10px 12px;border-radius:999px}
.chap span{background:var(--y);color:#111;border-radius:999px;padding:4px 18px;font-size:38px}
#dim{position:absolute;inset:0;background:rgba(3,6,14,.78);opacity:0}
#tl{position:absolute;left:0;top:0;width:1920px;height:170px;opacity:0}
#tl .ln{position:absolute;left:260px;top:92px;width:1440px;height:6px;background:rgba(255,255,255,.18);border-radius:3px}
#tl .fill{position:absolute;left:260px;top:92px;height:6px;background:var(--y);border-radius:3px;box-shadow:0 0 16px var(--y)}
.nd{position:absolute;top:95px;transform:translate(-50%,-50%);text-align:center}
.nd .dot{width:30px;height:30px;border-radius:50%;background:#2a3452;border:4px solid rgba(255,255,255,.5);margin:0 auto}
.nd .lb{position:absolute;left:50%;transform:translateX(-50%);top:-54px;font-weight:900;font-size:30px;white-space:nowrap;color:#aab3c9}
.nd .sl{position:absolute;left:50%;transform:translateX(-50%);top:36px;font-weight:800;font-size:24px;white-space:nowrap;color:#111;background:var(--y);padding:2px 12px;border-radius:8px;opacity:0}
.nd.on .dot{background:var(--y);border-color:#fff;box-shadow:0 0 24px var(--y)}
.nd.on .lb{color:#fff}
#band{position:absolute;left:0;bottom:0;width:1920px;height:100px;background:#000;display:flex;align-items:center;justify-content:center}
#sub{font-weight:800;font-size:46px;letter-spacing:-.01em;white-space:nowrap}
#sub span{color:#fff;margin:0 .12em}#sub span.on{color:var(--y)}
#wipe{position:absolute;top:-20%;height:140%;width:700px;background:var(--y);transform:skewX(-18deg);display:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%)}
#brand{position:absolute;right:40px;bottom:32px;font-weight:800;font-size:24px;color:rgba(255,255,255,.7)}
#brand b{color:var(--y)}
</style></head>
<body><div id="root">
<div id="bg"><div id="grid"></div></div>
<div id="stage"></div>
<div id="dim"></div>
<div id="fl"></div>
<div id="tl"><div class="ln"></div><div class="fill" id="tlfill"></div></div>
<div id="brand">공법의 신 <b>고상철</b></div>
<div id="vig"></div>
<div id="band"><div id="sub"></div></div>
<div id="wipe"></div><div id="flash"></div>
</div>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),P=(t,a,b)=>cl((t-a)/(b-a)),L=(a,b,x)=>a+(b-a)*x;
const oE=x=>x>=1?1:1-Math.pow(2,-10*x),oC=x=>1-Math.pow(1-x,3),ioC=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const oB=x=>{const c1=2.0,c3=c1+1;return x<=0?0:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
// build
const stage=$('stage'),fl=$('fl');
ITEMS.forEach((it,n)=>{const d=document.createElement('div');d.className='it';d.innerHTML=it.html;d.style.display='none';(it.flash?fl:stage).appendChild(d);it.el=d;});
const NX=[260,760,1260,1700],NL=['결정고시','2년','10년','20년'];
const nds=NX.map((x,i)=>{const d=document.createElement('div');d.className='nd';d.style.left=x+'px';d.innerHTML=`<div class="lb">${NL[i]}</div><div class="dot"></div><div class="sl"></div>`;$('tl').appendChild(d);return d});
function T(el,x,y,s,o,r=0,b=0){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s})`;el.style.opacity=o;el.style.filter=b>.3?`blur(${b}px)`:'none'}
let subIdx=-1;
function frame(t){
  let sc=0;SCENES.forEach((s,i)=>{if(t>=s.t0)sc=i});const S0=SCENES[sc];
  // bg
  const hues=[45,210,40,190,150,280,350,200,230,45];
  $('bg').style.background=`radial-gradient(ellipse at ${50+10*Math.sin(t*.2)}% ${45+8*Math.cos(t*.17)}%, hsl(${hues[sc%10]} 60% 16%) 0%, #070B16 62%)`;
  $('grid').style.transform=`translate(${(t*30)%80}px,${(t*18)%80}px)`;
  // items
  let focus=null,ft=-9,punch=0,dim=0;
  ITEMS.forEach(it=>{const el=it.el;const vis=t>=it.t-0.02&&t<it.tout+0.35;
    if(!vis){if(el.style.display!=='none')el.style.display='none';return}
    el.style.display='block';const p=t-it.t,out=P(t,it.tout,it.tout+.3);
    if(it.chapter){ // big center -> top-left header
      const a=oE(P(p,0,.35)),m=ioC(P(p,.9,1.4));const x=L(960,70,m),y=L(470,240,m);
      el.style.transformOrigin='0 50%';
      el.style.transform=`translate(${x}px,${y}px) translate(${L(-50,0,m)}%,-50%) scale(${L(1.9,1,m)*L(.6,1,a)})`;el.style.opacity=a*(1-out);el.style.filter='none';return}
    let s=1,o=1,dy=0,b=0,r=0;
    if(it.anim==='pop'){const q=P(p,0,.42);s=oB(q);o=cl(q*4)}
    else if(it.anim==='rise'){const q=oE(P(p,0,.5));dy=L(50,0,q);o=q;b=L(10,0,q)}
    else if(it.anim==='slam'){const q=oE(P(p,0,.3));s=L(2.4,1,q);o=cl(q*4);b=L(18,0,q)}
    else if(it.anim==='stamp'){const q=oE(P(p,0,.22));s=L(3,1,q);o=cl(q*5);b=L(14,0,q)}
    else if(it.anim==='flash'){const q=oE(P(p,0,.3));const e=P(t,it.tout-.35,it.tout);s=L(2.2,1,q)*(1+.04*P(p,.3,it.tout-it.t))*L(1,.6,oC(e));o=cl(q*4)*(1-e);b=L(20,0,q)+e*12;dim=Math.max(dim,cl(q*3)*(1-e))}
    T(el,it.x,it.y+dy,s,o*(1-out),r,b);
    if(!it.flash&&it.t<=t&&it.t>ft&&!it.chapter){ft=it.t;focus=it}
    if(p>=0&&p<.5)punch=Math.max(punch,(it.flash?1.2:it.anim==='stamp'||it.anim==='slam'?.9:.45)*Math.exp(-p*7));
  });
  $('dim').style.opacity=dim;
  // camera: drift toward latest item + punch
  const sp=P(t,S0.t0,S0.t1);let fx=960,fy=520;if(focus){const k=oC(P(t,focus.t,focus.t+.8));fx=L(960,focus.x,.55*k);fy=L(520,focus.y,.55*k)}
  const sc2=1.02+.03*sp+.035*punch;
  const sx=punch>0.3?Math.sin(t*95)*6*punch:0,sy=punch>0.3?Math.cos(t*80)*5*punch:0;
  stage.style.transformOrigin=`${fx}px ${fy}px`;stage.style.transform=`translate(${sx}px,${sy}px) scale(${sc2})`;
  // timeline
  $('tl').style.opacity=cl(P(t,TL.show,TL.show+.6));
  let mk=-2;TL.marks.forEach(m=>{if(t>=m[0])mk=m[1]});
  nds.forEach((d,i)=>d.classList.toggle('on',mk===-1||i===mk));
  const fillTo=mk===-1?3:Math.max(0,mk);$('tlfill').style.width=(NX[fillTo]-260)+'px';
  TL.labels.forEach(l=>{const sl=nds[l[0]].querySelector('.sl');if(t>=l[1]){sl.textContent=l[2];sl.style.opacity=1}});
  nds.forEach((d,i)=>{if(!TL.labels.some(l=>l[0]===i&&t>=l[1]))d.querySelector('.sl').style.opacity=0});
  // wipe at scene changes
  let w=false;SCENES.forEach((s,i)=>{if(!i)return;const d=t-s.t0;if(d>-.25&&d<.25){const e=ioC((d+.25)/.5);const el=$('wipe');el.style.display='block';el.style.left=L(-1200,2400,e)+'px';el.style.background=['#FFD60A','#22D3EE','#FF3B4E','#34E28A'][i%4];w=true}});
  if(!w)$('wipe').style.display='none';
  // flash
  let f=0;ITEMS.forEach(it=>{if(it.flash){const d=t-it.t;if(d>=0&&d<.2)f=Math.max(f,(1-d/.2)*.5)}});$('flash').style.opacity=f;
  // subs
  let si=-1;SUBS.forEach((s,i)=>{if(t>=s.s-.05&&t<s.e)si=i});
  if(si!==subIdx){subIdx=si;$('sub').innerHTML=si<0?'':SUBS[si].w.map(w=>`<span>${w[0]}</span>`).join('')}
  if(si>=0){const sp2=$('sub').children;SUBS[si].w.forEach((w,i)=>{sp2[i].className=t>=w[1]-.02?'on':''})}
}
window.frame=frame;
</script></body></html>
