<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:900;src:url(../assets/fonts/Pretendard-Black.otf)}
@font-face{font-family:P;font-weight:800;src:url(../assets/fonts/Pretendard-ExtraBold.otf)}
@font-face{font-family:P;font-weight:700;src:url(../assets/fonts/Pretendard-Bold.otf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:transparent;font-family:P,'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;color:#fff}
.a{position:absolute;left:0;top:0;white-space:nowrap;display:none}
.gold{background:linear-gradient(100deg,var(--goldD) 0%,var(--gold) 25%,var(--gold2) 45%,var(--gold) 60%,var(--goldD) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
g{color:var(--gold2)}
.glass{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:18px 34px;box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center}
.chip{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--ink);font-weight:900;font-size:40px;padding:12px 32px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.stamp{font-weight:900;font-size:70px;color:#fff;background:linear-gradient(135deg,#ff5468,var(--accent));padding:10px 34px;border-radius:16px;border:5px solid #ffd2d8;box-shadow:0 14px 34px rgba(200,16,46,.5)}
.row{display:flex;align-items:center;gap:14px;font-weight:900;font-size:40px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 26px 10px 10px;box-shadow:0 12px 28px rgba(0,0,0,.4)}
.ic{width:62px;height:62px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:36px}
.ttl{font-weight:900;font-size:28px;color:var(--gold);letter-spacing:.12em;margin-bottom:8px}
.sm{font-size:34px;font-weight:800;color:#d8deee}
.cap{white-space:normal;width:1000px;text-align:center;font-weight:900;font-size:56px;line-height:1.25;text-shadow:0 0 6px #000,0 4px 0 #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000}
.cap b{color:var(--hi)}
.ln{position:absolute;left:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);box-shadow:0 0 18px var(--gold)}
#sweep{position:absolute;top:0;width:220px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);opacity:0}
#flash{position:absolute;background:#fff6dc;opacity:0}
#dim{position:absolute;opacity:0}
</style></head><body>
<div id="BG"></div><div id="flash"></div><div id="dim"></div><div id="L"></div><div id="sweep"></div>
<script src="engine.js"></script>
</body></html>
